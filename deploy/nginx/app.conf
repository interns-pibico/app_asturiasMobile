# app_asturiasMobile — Nginx reverse proxy config
# Puerto: 8002 | Ruta: /mobile/ en el servidor existente
# Añadir en /etc/nginx/conf.d/app_example.conf dentro del bloque server

# ── Upstream ─────────────────────────────────────────────
# upstream app_asturiasMobile {
#     server 127.0.0.1:8002 fail_timeout=0;
# }

# ── Rutas para incluir en el server {} existente ──────────

# Static files — servidos directamente por nginx
location /mobile/static/ {
    alias /home/erpnext/.services/app_asturiasMobile/app/static/;
    expires 30d;
    add_header Cache-Control "public, immutable";

    location ~* \.(woff2|woff|ttf)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/mobile/static/vendor/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

# API endpoints
location /mobile/api/ {
    proxy_pass http://127.0.0.1:8002/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /mobile;
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
}

# All other pages (trailing slash redirect)
location = /mobile {
    return 301 /mobile/;
}

location /mobile/ {
    proxy_pass http://127.0.0.1:8002/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /mobile;
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
}
